<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <!-- ВРЕМЕННЫЙ постер УЛЬТИМА: золотой контровой свет, световые лезвия, зеркальный пол. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050408"/>
      <stop offset="0.5" stop-color="#1b0a12"/>
      <stop offset="0.68" stop-color="#3a1828"/>
      <stop offset="0.69" stop-color="#211019"/>
      <stop offset="1" stop-color="#050407"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3d6" stop-opacity="0.95"/>
      <stop offset="0.22" stop-color="#ecd3a1" stop-opacity="0.6"/>
      <stop offset="0.6" stop-color="#ae7789" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ae7789" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff7e8" stop-opacity="0"/>
      <stop offset="0.4" stop-color="#fff7e8" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#d8b77c" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="refl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ecd3a1" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ecd3a1" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="goldLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ecd3a1" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ecd3a1"/>
      <stop offset="1" stop-color="#ecd3a1" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.4" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.82"/>
    </radialGradient>
    <filter id="glow" x="-300%" y="-20%" width="700%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="soft" x="-30%" y="-80%" width="160%" height="260%"><feGaussianBlur stdDeviation="12"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="800" cy="600" r="560" fill="url(#sun)"/>
  <g filter="url(#glow)" fill="#f3d9a8" opacity="0.75">
    <rect x="216" y="120" width="22" height="480"/><rect x="476" y="70" width="22" height="530"/>
    <rect x="1102" y="70" width="22" height="530"/><rect x="1362" y="120" width="22" height="480"/>
  </g>
  <g fill="url(#blade)">
    <rect x="221" y="120" width="12" height="494"/><rect x="481" y="70" width="12" height="544"/>
    <rect x="1107" y="70" width="12" height="544"/><rect x="1367" y="120" width="12" height="494"/>
  </g>
  <rect y="616" width="1600" height="2" fill="url(#goldLine)"/>
  <g fill="url(#refl)">
    <rect x="221" y="620" width="12" height="200"/><rect x="481" y="620" width="12" height="240"/>
    <rect x="1107" y="620" width="12" height="240"/><rect x="1367" y="620" width="12" height="200"/>
  </g>
  <ellipse cx="800" cy="640" rx="330" ry="26" fill="#f3d9a8" opacity="0.28" filter="url(#soft)"/>
  <g fill="#08060a" stroke="#ecd3a1" stroke-opacity="0.8" stroke-width="3" stroke-linejoin="round">
    <path d="M742 440c-16 10-22 36-20 66 2 22 6 36 8 50-24 38-44 70-54 84h156c-10-28-24-58-40-84 4-24 8-56 2-84-6-24-26-36-52-32z"/>
    <ellipse cx="766" cy="400" rx="28" ry="34"/>
    <path d="M820 420c-18 10-24 36-22 70l8 150h86l8-150c2-34-4-60-22-70z"/>
    <ellipse cx="848" cy="376" rx="31" ry="38"/>
  </g>
  <g fill="#fff3d6">
    <circle cx="380" cy="300" r="2" opacity="0.5"/><circle cx="640" cy="220" r="1.500" opacity="0.4"/>
    <circle cx="980" cy="260" r="2" opacity="0.4"/><circle cx="1240" cy="330" r="1.500" opacity="0.45"/>
    <circle cx="700" cy="120" r="1.500" opacity="0.35"/><circle cx="920" cy="150" r="1.500" opacity="0.35"/>
  </g>
  <rect width="1600" height="900" fill="url(#vignette)"/>
</svg>
